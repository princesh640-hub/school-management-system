services:
  # ----------------------------------------------------------------------------
  # Production PostgreSQL 18
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: school_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Production Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: school_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Production MinIO Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: school_prod_minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Production NestJS API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: school_prod_api
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - internal_net
      - frontend_net

  # ----------------------------------------------------------------------------
  # Production Next.js 16 Web
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: school_prod_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME}/api/v1
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    networks:
      - frontend_net

  # ----------------------------------------------------------------------------
  # Production Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: school_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - frontend_net
      - internal_net

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  internal_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
