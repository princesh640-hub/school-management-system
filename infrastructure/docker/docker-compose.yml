services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 18 Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine # PostgreSQL stable with forward-compatible 18 semantics
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-school_management_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-school_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school_net

  # ----------------------------------------------------------------------------
  # Redis (Cache, Queues, Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: school_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school_net

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Object Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: school_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school_net

  # ----------------------------------------------------------------------------
  # NestJS + Fastify Backend API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: school_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      API_HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-school_management_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_do_not_use_in_prod_12345678}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_do_not_use_in_prod_12345678}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_net

  # ----------------------------------------------------------------------------
  # Next.js 16 Web Portal
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: school_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
    depends_on:
      - api
    networks:
      - school_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  school_net:
    driver: bridge
